name: Build Fishing EXE

on:
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    paths:
      - "fishing-macro/**"
      - ".github/workflows/build-fishing.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller mss numpy pillow
      - run: pyinstaller --onefile --noconsole --name "XZX Fishing" --icon fishing-macro/xzx_fishing.ico fishing-macro/fishing_macro.py
      - uses: actions/upload-artifact@v4
        with:
          name: XZX-Fishing-exe
          path: "dist/XZX Fishing.exe"
          if-no-files-found: error
      - name: Publish exe to a branch I can fetch
        shell: bash
        run: |
          mkdir out && cp "dist/XZX Fishing.exe" "out/XZX Fishing.exe"
          cd out
          git init -q
          git checkout -q -b exe-dist
          git config user.email "bot@users.noreply.github.com"
          git config user.name "exe-bot"
          git add -A
          git commit -q -m "fishing exe build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" exe-dist
